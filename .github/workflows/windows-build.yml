name: Windows build

# The full CMake build of the README's Building section: the recompiler and the runner (the preset's default
# targets). The native module (--target module) is left out: it needs the player's disc. Run by hand.
on:
  workflow_dispatch:

jobs:
  build:
    name: Windows build
    # The submodules (piconet-protocol, the forks) are private repos until the repos go public; then this job runs.
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    env:
      LLVM_VERSION: "20.1.8"
    steps:
      # submodules: true, not recursive: port/setup/trees.sh checks the forks' own submodules out into the work
      # folder, at the commits RecompCore records.
      - uses: actions/checkout@v4
        with:
          path: piconet-runner
          submodules: true
      # The runner's icon comes from the launcher's checkout beside this one (pins.tsv REPO_LAUNCHER).
      - uses: actions/checkout@v4
        with:
          repository: piconet-live/piconet-launcher
          path: piconet-launcher
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: CMake, Ninja and keystone
        run: python -m pip install cmake==4.1.1 ninja==1.11.1 keystone-engine
      - name: LLVM
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          tar -xf llvm.tar.xz
          echo "LLVM_ROOT=$RUNNER_TEMP\\clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc" >> "$GITHUB_ENV"
      # Visual Studio 2022 (17.x) with the C++ workload, as the README asks.
      - name: Visual Studio
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -version "[17.0,18.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio 2022 with the C++ tools on this runner" }
          "VS_ROOT=$vs" >> $env:GITHUB_ENV
      # The work folder's source trees (port/setup/setup.sh's trees step), at build/work, the preset's default.
      - name: Source trees
        shell: bash
        working-directory: piconet-runner
        run: port/setup/trees.sh build/work
      # The preset's default targets: the recompiler and the runner. PORT_PROFILE=none: the release's training
      # profile is not in the repository (it matters only to --target module).
      - name: Build
        shell: cmd
        working-directory: piconet-runner
        run: |
          call "%VS_ROOT%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set "PATH=%LLVM_ROOT%\bin;%PATH%"
          cmake --preset windows -DPORT_PROFILE=none "-DPORT_LLVM_ROOT=%LLVM_ROOT%" || exit /b 1
          cmake --build --preset windows || exit /b 1
