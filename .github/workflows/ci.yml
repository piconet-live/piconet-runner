name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    # The submodules (piconet-protocol, the forks) are private repos until the repos go public; then this job runs.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      # The plain check needs external/protocol only (the forks are for the Windows build) and the launcher's
      # checkout beside this one (pins.tsv REPO_LAUNCHER ../piconet-launcher).
      - uses: actions/checkout@v4
        with:
          path: piconet-runner
      - name: Protocol submodule
        working-directory: piconet-runner
        run: git submodule update --init --depth 1 external/protocol
      - uses: actions/checkout@v4
        with:
          repository: piconet-live/piconet-launcher
          path: piconet-launcher
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: liblzma for the core's tests (the compact replay file's xz parts)
        run: sudo apt-get install -y liblzma-dev
      - name: Keystone for the image's checks
        working-directory: piconet-runner
        run: python -m venv .venv && .venv/bin/pip install keystone-engine
      - name: Check
        working-directory: piconet-runner
        run: port/check.sh
      - name: The port's sources mirrored into a new work folder, twice
        working-directory: piconet-runner
        run: |
          mirror() { cmake -DROOT="$PWD" -DDEST="$RUNNER_TEMP/src" -DPROTOCOL="$PWD/external/protocol/protocol/generated" -DICON="$PWD/../piconet-launcher/net/src/Launcher.App/Assets/Icon/app.ico" -P port/build/cmake/PortSources.cmake; }
          mirror && sleep 1 && touch "$RUNNER_TEMP/stamp" && mirror
          test -f "$RUNNER_TEMP/src/core/include/fzgx/art.h" && test -f "$RUNNER_TEMP/src/app/app.ico"
          test -z "$(find "$RUNNER_TEMP/src" -type f -newer "$RUNNER_TEMP/stamp")"   # the second run wrote nothing
      - name: Scripts parse
        working-directory: piconet-runner
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n
