# ---- sources of difference between two runs --------------------------------------------------------------------------

[[difference]]
name = "clock"
what = "The emulated clock seeds the OS time base, and through it the boot's timing, the load address and the random generators."
pinned = "setting"
by = "Core.CustomRTCValue"
source = "SD 'What the clock changes'"

[[difference]]
name = "module-load-address"
what = "main.rel's address comes from a tick-derived pad, and everything allocated after it follows."
pinned = "pin"
by = "mainrel-pad"
source = "SM §3; PP §2.1"

[[difference]]
name = "boot-arena-contents"
what = "The pad of fze.sample.rel's allocation moves stale data left in the top of the arena."
pinned = "pin"
by = "sample-alloc-pad"
source = "PP §2.2"

[[difference]]
name = "race-setup-seeds"
what = "Which machine each CPU seat drives is shuffled from the DOL's generator at 0x801A63C0, whose state depends on everything since boot; the CPUs also take a seed from the tick (fn_1_F47AC). A longer code list alone changed the race."
pinned = "codes"
by = "port/image/routines/setup.py"
note = "setup.py holds the generator at a constant until the race and makes fn_1_F47AC return a constant. The saved states carry the result."
source = "SR 'The cause', 'The fix, tested', 'In use'"

[[difference]]
name = "boot-history"
what = "Everything else the boot leaves behind (code list length, boot frames)."
pinned = "scene"
by = "race300"
note = "Both cores load the same saved state, recorded under the reference."
source = "SM §4 (Method)"

[[difference]]
name = "input"
what = "Controller input, and the field on which it lands."
pinned = "scene"
by = "race300"
note = "The probe scripts port 0 per VI field, so inputs land on exact fields in every run."
source = "SM §1 (Runs) and §4 (Method)"

[[difference]]
name = "memory-card"
what = "The memory card's contents at the start of a run."
pinned = "harness"
note = "The launcher copies a pristine card into the user folder before every run. Only the script says so."
source = "scripts launch.sh (the first experiment's)"

[[difference]]
name = "cycle-accounting"
what = "The JIT and native code charge cycles differently, so timebase values and the points where interrupts are delivered differ between the two cores for the same guest code."
pinned = "noise"
by = "timebase-words"
note = "Nothing reached from the simulation tasks reads the timebase; what the timing feeds ends up in profiling words, presentation and the heap's noise."
source = "PP §1.3 'Timebase reads across engines'; SM §4"

[[difference]]
name = "audio-buffers"
what = "Sound updates reach the mixer on the audio clock, 200 times a second. Native's emulated timeline is not the JIT's cycle for cycle, so now and then an engine voice's pitch or pan update lands one 5 ms audio frame later than under the JIT; from then on that voice's position and every buffer of mixed samples differ. Against the JIT that is 14-20 thousand words at the fixed guest points: the AX voice blocks (0x80164D60), the output buffers (0x8015E880), heap blocks at 0x80574C40 (about 53 KB) and 0x8058BA80 (about 21 KB)."
pinned = "noise"
by = "audio"
note = "Shown with the voice log: every differing game-written field is the same value within one audio frame, no value occurs in one run only, and the music stream's voices never differ. Native is sample-identical to itself across core modes and builds at normal speed. Between two unthrottled dual-core runs of builds 18b and 19 the same shift occurs; it did not between two JIT runs. The 53 KB heap block is still identified by inference only."
source = "SC+ 'Audio', 'The dual-core gate' (The audio regions)"

[[difference]]
name = "host-time"
what = "Two runs of native code differ in a few words that hold host time."
pinned = "noise"
by = "host-time"
source = "SC Method ('Native against native is the sharp gate')"

[[difference]]
name = "gpu-thread-timing"
what = "In dual core, when GPU work and interrupts land differs from run to run, for the JIT and for native alike."
pinned = "noise"
by = "dual-core-timing"
source = "SC+ 'The dual-core gate'"

[[difference]]
name = "dual-core-start-slip"
what = "From the grid scene in dual core, race frame 1 falls on field 86 under the JIT and sometimes on field 87 under native code. The racer state is then identical for every race frame and offset by one field."
pinned = "by-step"
note = "Cause, tested: native skips the GPU-sync wait loop as idle and reaches the next VI while the GPU thread is still busy. In dual core the gate is by race frame. Not fixed in the emulator."
source = "SC+ 'The race start in dual core'"

