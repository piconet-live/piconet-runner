# ---- discovered facts ------------------------------------------------------------------------------------------------

[[fact.hot_root]]
name = "fn_1_83858"
entry = "main.rel:text+0x83858"
what = "The per-machine physics update: 30 calls a frame, 4.4K ticks a call at overclock 6 (about 20K guest instructions)."
source = "SM §5"

[[fact.hot_root]]
name = "fn_1_850C4"
entry = "main.rel:text+0x850C4"
what = "The second physics task: one call a frame, 134.8K ticks at overclock 6."
source = "SM §5"

[[fact.hot_root]]
name = "fn_1_C4ABC"
entry = "main.rel:text+0xC4ABC"
what = "The AI driver, one task per machine. The third of the three physics tasks the guest-code figure sums."
source = "SC 'Sizing the big levers'; RO 'Thirty players, every prediction missing'"

[[fact.wait_loop]]
name = "os-idle"
kind = "os-idle"
idle_pc = 0x8001071C
what = "The OS idle loop (SelectThread). Dolphin's JIT skips it by itself; native code spins in it."
source = "SM §2"

[[fact.wait_loop]]
name = "gpu-sync"
kind = "busy-wait"
idle_pc = 0x8006FE18
what = "fn_8006FDEC waits for the GPU's draw-done flag in a loop that calls OSGetTime (0x8006FE14-0x8006FEA8). Idling it took dispatches from 80,438 to 48,677 a field; physics unchanged. The analyser of RecompCore PR #19 does not find it, because the loop contains a call. In dual core it causes the race-start slip."
source = "SC §1; SC+ 'The race start in dual core'"

[[fact.wait_loop]]
name = "disc-read"
kind = "busy-wait"
idle_pc = 0x80006388
what = "The executable's synchronous disc read (fn_80006354): it starts a read whose callback clears a flag, then loops `while (flag) fn_8000659C()`. fn_8000659C polls the drive's status and switches on it through a jump table; that `bctr` leaves native code, so each turn is two trips through the run loop and two mtmsr through the instruction hook. With overclock 6 the loop turns about 170,000 times a field: 36 to 41 ms a field on native code, 6 to 12 under the JIT. This is the loop's head, where fn_8000659C returns to."
source = "the port-recomp notes 5.9.2 (runs b1n, b2n, t5, t8)"

[[fact.wait_loop]]
name = "load-queue"
kind = "busy-wait"
idle_pc = 0x802C1008
what = "main.rel's wait for its load queue (text+0x1068C0 to 0x1068D0): `do { fn_1_451E4(); fn_1_D3214(); } while (fn_1_467F4() != 0)`, where fn_1_467F4 calls fn_8000659C and returns what is still queued. Seven trips through the run loop a turn; 61 to 141 ms a field for the 19 fields of a course load on native code, 13 to 14 ms under the JIT. This is where fn_1_467F4 returns to. Needs main.rel at 0x801BA660 (the pins)."
note = "With both disc waits idle a Time Attack start reaches every mode and the green light on the same field as without, and as the JIT (runs t5, t4, t8, t4j: mode 2 at 3,240, go at 4,704)."
source = "the port-recomp notes 5.9.2"

[[fact.closed_unit]]
name = "physics"
roots = [
  "main.rel:text+0x83858",   # fn_1_83858, the per-machine task (the task runner calls it 30 times a field)
  "main.rel:text+0x850C4",   # fn_1_850C4, the big task (1)
  "main.rel:text+0xC4ABC",   # fn_1_C4ABC (29)
  0x80080974,                # fn_80080974 in the DOL: a write callback of the C library's formatter
  "main.rel:text+0x18FFC",   # called through a pointer by fn_1_18B40 and fn_1_17098 (160 each)
  "main.rel:text+0x19AE0",
  "main.rel:text+0x1B010",
  "main.rel:text+0x32A40",   # by fn_1_850C4 (30)
  "main.rel:text+0x331EC",   # the vanilla target of fn_1_83858's per-machine hook pointer (30)
  "main.rel:text+0x59514",
  "main.rel:text+0x59CC8",
  "main.rel:text+0x5D88C",
  "main.rel:text+0x5E3C4",
  "main.rel:text+0x60F7C",
  "main.rel:text+0x64098",
  "main.rel:text+0x8B9B8",   # by fn_1_850C4 (1)
]
functions = 495
deferral = true
why_safe = "The three tasks' own direct closure reads no clock: no mftb and no mfspr of TBL or TBU in the 219 functions reachable by direct calls. (The whole set does hold OSGetTime's function, through the formatter and the low-rate roots.) Events land at most one task later (131K ticks), the kind of shift builds 11-14 made with racer state unchanged. Shown on runs of over 5,000 fields on both scenes, in both configurations."
found_by = "closed-roots.sh: the three tasks plus every function that code of the set calls through a pointer at least 50 times in the training profile, to a fixpoint."
note = "Each function has a byte that says whether its closed body may be entered, so a host with call hooks installed can still use closed bodies for everything it does not intercept (build 18d). A target of the per-machine hook pointer outside the module leaves through an escape."
source = "SC+ '18. Closed physics' (the 16 roots, Hooks, the hook pointer); SC 'Sizing the big levers' (the closure reads no clock)"

