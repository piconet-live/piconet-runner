# ---- exactness -------------------------------------------------------------------------------------------------------

[exactness]
step_counter = "main.rel:bss+0x50A4"
statement = "Covered: the 30 racer blocks at every field (single core) or race frame (dual core) against the JIT, on both scenes; main.rel's .data and .bss at three fixed guest points per scene; a build against itself and against the build before, over whole memory. Not covered: any other course, the menus and menu modules, a race finish or respawn, a recorded online replay, anything with mods loaded, and whole memory against the JIT (see the difference 'audio-buffers')."
note = "The step counter is the race frame: it rises 60 a second during the race and runs before the start."
source = "SD ('.bss+0x50A4'); SM §4 and §7; SC Method; SC+ 'The dual-core gate'"

[[exactness.noise]]
name = "timebase-words"
what = "The game's own timebase-derived profiling words in main.rel's .bss: six words and a 64-bit timestamp ring."
words = ["main.rel:bss+0x4", "main.rel:bss+0xD90", "main.rel:bss+0xDA0", "main.rel:bss+0x50D4", "main.rel:bss+0x6C854", "main.rel:bss+0x6C858"]
ranges = [{ start = "main.rel:bss+0x6EA00", end = "main.rel:bss+0x6EC00" }]
source = "SM §4 (Whole RAM at a fixed guest point)"

[[exactness.noise]]
name = "timebase-word-50c4"
what = "One more time-derived word, which differs from the JIT in every grid run."
scenes = ["racego"]
words = ["main.rel:bss+0x50C4"]
note = "dcnoise.py leaves it out on both scenes; the note names it for the grid scene only. Whether it is noise on race300 too is not settled."
source = "SC §5b ('9a against 7b in RAM'); scripts dcnoise.py"

[[exactness.noise]]
name = "grid-bss"
what = "About 170 words of main.rel's .bss, with a copy in the heap, that differ from the JIT in every grid run, single core included: a thread's saved FP context (lbl_1_bss_854B8), stale register values from wherever an interrupt caught the main thread."
scenes = ["racego"]
ranges = [{ start = "main.rel:bss+0x85B98", end = "main.rel:bss+0x86D74" }]
source = "SC Method (whole RAM against the JIT from the grid); SC+ 'The dual-core gate'"

[[exactness.noise]]
name = "host-time"
what = "Words that hold host time, which differ between any two native runs: two timestamps and counters in a heap block."
configurations = ["single-core"]
words = [0x80178A30, 0x80178AD8]
ranges = [{ start = 0x80596870, end = 0x80598EBC }]
note = "6-9 words in early builds, 4 DOL words between later ones."
source = "SC Method ('Native against native is the sharp gate'); SC §10, §13, §15"

[[exactness.noise]]
name = "event-timing"
what = "Where a change that moves event timing shows between two native builds: the heap block that also holds the host-time counters, four timestamps, and an OS stack."
configurations = ["single-core"]
ranges = [{ start = 0x80596534, end = 0x80599264 }, { start = 0x80178A30, end = 0x80178AE0 }, { start = 0x801B5D30, end = 0x801B5EFC }]
note = "No gate ignores it. It is here so that the 200-570 words such a change shows (builds 9a, 11-14, 18b) can be read against it."
source = "SC §5b ('9a against 7b in RAM'), §11-12, §14"

[[exactness.noise]]
name = "dual-core-timing"
what = "The fixed set of regions that differ between two runs of one build when the GPU has its own thread: the main thread's saved context, timestamps, OS stacks and thread contexts, and the heap block that holds the host-time counters."
configurations = ["dual-core"]
ranges = [
  { start = 0x8015C400, end = 0x8015C748 },   # the main thread's saved context
  { start = 0x8015CB00, end = 0x8015CC00 },
  { start = 0x80178A00, end = 0x80178B40 },   # timestamps
  { start = 0x801A6780, end = 0x801A67C0 },
  { start = 0x801A6C00, end = 0x801A6D00 },
  { start = 0x801B5980, end = 0x801B7800 },   # OS stacks and thread contexts
  { start = 0x80596500, end = 0x80599D00 },   # the heap block with the host-time counters
]
note = "The same set between two JIT runs and between two native runs: 61-201 words of whole memory differ JIT against JIT. Stack words down to 0x801B5980 were added with build 19. The audio regions are a set of their own, 'audio'."
