name = "locked-cache"
guest_base = 0xE0000000
what = "The locked L1 cache, the game's scratchpad: 168,000 reads and 106,000 writes a frame, each an indirect call into the MMU until the second direct window covered it."
source = "SM §5 (Fixed during the spike)"

