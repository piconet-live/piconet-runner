name = "gather-pipe"
guest_base = 0xCC008000
what = "The GX gather pipe: about 19,000 writes a field in dual core, each a call through the hardware-write hook until they were emitted inline (about 2,000 flush calls remain)."
source = "SC 'Sizing the big levers' (Gather-pipe writes); SC+ '16'"

[[fact.fallback]]
name = "gecko-hook"
at = "main.rel:text+0xECC"
why = "fn_1_ECC's first instruction is the boot code's branch out of the module, so its 16 KB chunk stays on the fallback JIT. Not hot. One direct call reaches it (bl at 0x801BAB54); the native body leaves at once."
source = "SM §3; SC 'Calls from native code and the runtime's verification'"

# ---- the current best build ------------------------------------------------------------------------------------------

[build]
name = "20"
backend = "llvm"
args = ["--native-abi", "off"]
platform_args = ["--cpu", "gekko", "--gamecube"]
target = "Baseline x86-64. The module needs a CPU with FMA3 at run time; the fma feature is attached to marked functions after optimisation, never shown to the IR optimiser."
never = [
  "--semantics fast: it turns on fusion, which changes results (PP §1.2)",
  "an x86-64-v3 target: every such build diverged at race frame 1,022, cause not isolated (SM §4)",
  "DOLRECOMP_FMA_EARLY=1: with the fma feature visible to the IR optimiser exactness broke 100 fields in; the transformation is not isolated (SC §3 and 'The optimiser and the fma feature')",
  "DOLRECOMP_FPRF_KEEP: the FPRF keep list showed visibly jumping scenery and gave no speed (SM §4); taken out of the recompiler",
]
pgo = true
note = "Module 20: closed, deferred bodies for every task the runner calls (140 roots, 2,195 functions), the GPU wait and the OS idle loop excluded. Dual core against its batch's JIT: fn_1_83858 21.5-21.9 us, guest code in the physics 1.29-1.30 ms a frame (JIT 1.23-1.27), CPU thread 3.07-3.14 ms (JIT 2.75-2.84), 1,278 dispatches a field. Every gate passes. Build 19 (module 18d: the same switches with the 16 roots of closed-roots-18.txt and no exclusion) is within noise in dual core and has a quarter of the deferred surface: the conservative choice for a first playable build. A profile-guided build takes 12-15 minutes at 16 jobs. DOLRECOMP_CODEGEN_REV changes no code; it only keys the object cache."
source = "SC+ Status, '18', '19', '20', 'State at hand-over'; SC §1 (--native-abi off), §3 (the target), §15 (PGO); scripts cg-build.sh (--cpu gekko --gamecube)"

[build.switches]
DOLRECOMP_MEM2_BASE = "0xA0000000"            # SM §5: the second direct window covers the locked cache
DOLRECOMP_SCALAR_FP = "inline"                # SC §2
DOLRECOMP_PAIRED_FP = "jit64"                 # SC §3
DOLRECOMP_FMA = "hw"                          # SC §3 and 'The optimiser and the fma feature'
DOLRECOMP_FPRF = "lazy"                       # SC §4
DOLRECOMP_STATE_SYNC = "changed"              # SC §5a
DOLRECOMP_PSQ_GQR = "0:0"                     # SC §6
DOLRECOMP_RESERVATION = "stwcx-only"          # SC §7
DOLRECOMP_PRESERVE_NONE = "1"                 # SC §7
DOLRECOMP_STATE_ALIAS = "scoped"              # SC §5b
DOLRECOMP_CYCLES = "deferred"                 # SC §10
DOLRECOMP_FPSCR = "inline"                    # SC §10
DOLRECOMP_BUDGET_CYCLES = "runtime"           # SC §11
DOLRECOMP_INDIRECT_CALLS = "native"           # SC §12
DOLRECOMP_INDIRECT_CALL_EXITS = "801BE858"    # SC §12: the task runner's call site, kept for the probe
DOLRECOMP_ENTRY_LOADS = "split"               # SC §13
DOLRECOMP_CALL_COUNTERS = "registers"         # SC §14
DOLRECOMP_GATHER_PIPE = "inline"              # SC+ §16
DOLRECOMP_LLVM_CHUNK_INSTRUCTIONS = "4096"    # SC+ §17a
DOLRECOMP_CLOSED_DEFER = "1"                  # SC+ §18
DOLRECOMP_CLOSED_EXCLUDE = "8006FDEC,8001071C"  # SC+ §20: the GPU wait and the OS idle loop stay ordinary
DOLRECOMP_CODEGEN_REV = "20"                  # SC+ State at hand-over: keys the object cache only
# SC+ §20: 140 roots (the tasks and their pointer targets): the list of [[fact.closed_unit]] "tasks"
DOLRECOMP_CLOSED_ROOTS = "8023DF94,8023F800,8027F1F8,80080974,801D3738,801D421C,801D574C,801ED17C,801ED928,80213C50,80214404,80217FC8,80218B00,8021B6B8,8021E7D4,802460F4,8023EF9C,8023DF94,80211488,80211034,8027F1F8,802B1FE8,80316AA8,8030EED4,80304764,802E37B8,802E3690,802B2014,802B1864,802A3CF0,8029F110,8029E12C,8029E010,8028CEF4,8028CB40,8027EA30,80254EF8,80254D08,80252A98,8025296C,80248490,8023F800,80239224,80239100,80236234,802335F8,80233124,80213474,802133A8,802130D0,80212DD0,8020ECF4,801FB024,801FA028,801EF8B4,801EF860,801E99D0,801E7774,801E6EA4,801C381C,801C0B10,801C0AD0,8000DD10,802133C8,80213418,802BF11C,801EF060,802BF80C,80011C74,8001A55C,8001D7D0,8001E4FC,8001EAF4,80028FA0,800307CC,800343BC,80034488,8004EA94,8004EB00,80055768,80058380,801C298C,802087E0,80210384,802105DC,80211924,80213B88,80213BA8,80213C08,80213C28,80213D68,80213EAC,802141AC,80214490,80214620,80215008,8021775C,802178F4,80218054,80218058,802186E0,80218C14,80219244,802192D4,80219D00,8021B6BC,8021B6C0,8021B7AC,8021E7E0,8021EA24,8021EAC4,8021ED04,8021F018,8021F558,80220298,80220418,80221DBC,80222448,8022265C,80222790,80222830,80241E8C,80248AE0,80253018,80253554,80253664,802BBB40,802BBB64,80012A74,80013934,80020464,80021AB8,80021B2C,800700F4,802225D0,802634A0,8001C704,800243C4,80025854,8005ADBC,8006AF94,8025A694,80058070"

