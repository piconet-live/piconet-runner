state = "race300.sav"
recorded_under = "ModernGekko's JIT, at race frame about 300 of the boot-race scene"
input = "0:100"
fields = 1800
dump_steps = [600, 1200, 2000]
screenshot_field = 260
uses = ["timing", "gate", "training", "long"]
note = "The timing scene. Its screenshot never shows another machine."
source = "SM §4 (Method; dump frames); SC header and Method (1,800 fields); scripts cg-run.sh (input 0:100, screenshot field)"

[[scene]]
