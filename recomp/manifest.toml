compare_from_step = 1
screenshot_field = 130
uses = ["gate", "screenshot", "long"]
note = "During the countdown 21 fields differ in every native build, the one before any FP change included: the probe hashes at the VI, where the main thread is caught at a different point of its frame. Racer hashes are equal from the green light on. Profile B of build 15b was trained here; the kept build trains on race300 only."
