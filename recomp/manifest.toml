ranges = [
  { start = 0x8015E880, end = 0x80160C80 },   # the audio output buffers
  { start = 0x80164CC0, end = 0x80164D20 },   # six timestamps at the end of lbl_80160C80
  { start = 0x80164D60, end = 0x80176160 },   # the AX voice parameter blocks (lbl_80164D60)
  { start = 0x80180F00, end = 0x80181440 },   # words in lbl_8017E984, not identified
  { start = 0x80195B00, end = 0x80195B80 },   # words in lbl_80193B48, not identified
  { start = 0x80199640, end = 0x80199670 },
  { start = 0x8058BA80, end = 0x80591000 },   # a 21.7 KB heap block
]
note = "Between two dual-core runs of one build: 0 words in 10 JIT pairs and in the pairs of 15c and 16; 590 to 6,958 words in every pair of 18b and 19 at race frames 900 and 1,500. Why those builds vary where the others did not is not established."
source = "SC+ 'The dual-core gate' (The audio regions), 'Audio'; scripts dcnoise.py"

[[exactness.noise]]
name = "start-shift"
what = "Words that follow a run that lost display fields (a race start shifted by one, or fields lost while racing): a field counter and its copy, and the part of the timestamp ring beyond the timebase mask. One apart or filled one slot on in a run that slipped one field (14 words); equal in a run that did not."
configurations = ["dual-core"]
scenes = ["race300", "racego"]
words = ["main.rel:bss+0x50", "main.rel:bss+0x6F640"]
ranges = [{ start = "main.rel:bss+0x6EC00", end = "main.rel:bss+0x6F1D8" }]
reference_pairs = { race300 = "2026-10-05, port/runs: g1-dual-core-race300-ref (a JIT run that lost five fields between race frames 600 and 1,200) against g1b-dual-core-race300-ref and against g2-dual-core-race300-ref: 63 words at race frames 1,200 and 2,000, none at 600; every other differing word of the module's data is in 'timebase-words'. The two other JIT runs against each other: none.", racego = "2026-10-15, port/runs: gv022-214152-dual-core-racego-ref-1 against gv022-214152-dual-core-racego-ref-2, and the same pair of gv022rb1: two JIT runs of one scene differ in 154 words at steps 300, 900 and 1,500, every one of them in this set (.bss+0x50 and the timestamp ring); the native runs of those batches differ from them in 168 to 175 words, all in this set; the racers' hashes are equal at every step in all six pairs. Seen on every batch of runners 0e584cbf and b748eec2, 0.2.1's own module (efxv021) included; runner 8ecdb2c9 had none (gdn2wa)." }
note = "The gate 'module-data' passes it by name where two JIT runs showed it against each other (the line says 'pass, noise: start-shift'): on race300 since 2026-10-05, and on racego since 2026-10-15, when two JIT runs of the 0.2.2 release batch differed in these words (before that no JIT run had lost a field on racego: 0 of 10 in the codegen spike, 0 of 9 on 2026-10-05; the port-recomp notes 5.9.14). What would remove the slip itself instead of naming it: the wait for the picture idling only until the GPU thread has caught up (the spike-dolrecomp-codegen notes, 'Remaining leads'; sized, not built)."
source = "SC+ 'The dual-core gate' (Words that follow a shifted race start); scripts dcnoise.py; the port-recomp notes 5.6, 5.9.14"

[[exactness.gate]]
name = "racers-per-field"
kind = "hash"
hashes = ["seat0_hash", "racers_hash"]
by = "field"
against = "reference"
configurations = ["single-core"]
max_differing = 0
note = "On racego the comparison starts at the green light (the scene's compare_from_step)."
source = "SM §4 (Racers); SC Method; scripts cmp.py, cg-gate.sh"

[[exactness.gate]]
name = "racers-per-race-frame"
kind = "hash"
hashes = ["seat0_hash", "racers_hash"]
by = "step"
against = "reference"
configurations = ["dual-core"]
max_differing = 0
note = "By race frame because the race start can slip a field in dual core; a shift is reported, not failed. All 30 seats: cmprf.py compared seats 1-29 only until build 18, and every saved dual-core run of 18b and 18d was re-evaluated with both hashes."
source = "SC+ 'The race start in dual core' and 'The dual-core gate' (All 30 seats); scripts cmprf.py"

[[exactness.gate]]
name = "racers-run-to-run"
kind = "hash"
hashes = ["seat0_hash", "racers_hash"]
by = "step"
against = "self"
configurations = ["dual-core"]
max_differing = 0
source = "SC+ 'The dual-core gate' (JIT against JIT, native against native: identical)"

[[exactness.gate]]
name = "module-data"
kind = "memory"
within = ["main.rel:data", "main.rel:bss"]
ignore = ["timebase-words", "timebase-word-50c4", "grid-bss"]
pass_named = ["start-shift"]
dead_stacks = true
against = "reference"
configurations = ["single-core", "dual-core"]
max_differing = 0
note = "In dual core a run that lost a display field differs in the words of 'start-shift': they pass by name where a pair of JIT runs showed them (the line and a batch's tally say how often), and fail everywhere else. Words below a guest thread's saved stack pointer are left out in both dumps (dead_stacks, the kit's deadstack.py), and the line counts them: main.rel .bss+0x85B98 is an OSThread record that has ended (state 0, out of the active queue), its stack .bss+0x85EC0 to +0x86EC0 and its last r1 at +0x86E80; v030's batch (gv030-024218, racego pair 2) differed in 23 words of it, at +0x86D9C to +0x86E44, in one JIT run (a pad-read path's frames), and all six pairs are exact without them. The pointers at +0x86DDC, +0x86E1C, +0x86E58, read on 2026-10-05 as which of two drawing buffers is current (the port-recomp notes 5.9.14), lie in that dead stack too; .bss+0x85B88, just before the record, is still compared."
source = "SM §4 (Whole RAM); SC+ 'The dual-core gate'; scripts dcnoise.py; the port-recomp notes 5.9.14"

[[exactness.gate]]
name = "run-to-run-single"
kind = "memory"
ignore = ["host-time"]
against = "self"
configurations = ["single-core"]
max_differing = 0
note = "The JIT reproduces its whole memory exactly from one session to the next; two native runs differ only in the host-time words."
source = "SC Method"

[[exactness.gate]]
name = "previous-build"
kind = "memory"
ignore = ["host-time"]
against = "previous"
configurations = ["single-core"]
scenes = ["racego"]
max_differing = 0
note = "The sharp gate, for a change that must be invisible to the guest. A change of semantics shows exactly its words; a change that moves event timing shows a few hundred words in the 'event-timing' regions and is then judged on those regions and on the racer hashes."
source = "SC Method ('Native against native is the sharp gate'); scripts cg-cycle.sh"

[[exactness.gate]]
name = "run-to-run-dual"
kind = "memory"
ignore = ["timebase-words", "timebase-word-50c4", "grid-bss", "dual-core-timing"]
against = "self"
configurations = ["dual-core"]
max_differing = 0
note = "No word outside the noise regions. Build 18b against itself first showed 0-3 words outside; they were in the 70 KB buffer now in the set."
source = "SC+ 'The dual-core gate' and 'Exactness of 18b'; scripts dcnoise.py"

# ---- the probe -------------------------------------------------------------------------------------------------------

[probe]
select_value = "mode"
select_equals = 2
skip_fields = 60
timer_call = "main.rel:text+0x411C"
timer_return = "main.rel:text+0x4120"
timer_call_word = 0x4E800421
timer_return_word = 0x38600005
dump_at = "first-timer-call-of-step"
trace_calls = "fn_1_83858"        # the access trace tells the 30 per-machine calls of a frame apart
trace_frame_end = "fn_1_850C4"    # the big task follows them
dump_suffix = ".task{step}.ram"
legacy_total_column = "tasks"
note = "Tasks are timed between the task manager's bctrl and its return: HLE hooks under the JIT, the dispatch loop when native. The probe in use is FzgxProbe, with these addresses compiled in; `env` maps the contract's variables onto its own until it is replaced (recomp-kit docs/probe.md)."
source = "SM §5 (the call site); probe (instruction words, mode == 2, the trace's two tasks); scripts tasks.py (mode 2, the first 60 fields skipped); SC 'Sizing the big levers' B (the access trace)"

[probe.env]
RECOMP_PROBE = "FZGX_PROBE"
RECOMP_PROBE_CONFIG = ""                      # FzgxProbe takes no configuration file: its addresses are compiled in
RECOMP_PROBE_INPUT = "FZGX_PAD"
RECOMP_PROBE_TIMERS = "FZGX_TASKPROF"
RECOMP_PROBE_DUMP_STEPS = "FZGX_TASKDUMP"
RECOMP_PROBE_HASH = "FZGX_PROBE_HASH"
RECOMP_PROBE_SAMPLE = "FZGX_SAMPLE"
RECOMP_PROBE_SAMPLE_IN_TIMERS = "FZGX_SAMPLE_TASKS"
RECOMP_PROBE_SAMPLE_NAMED_ONLY = "FZGX_SAMPLE_PHYSICS"
RECOMP_PROBE_CENSUS = "FZGX_CENSUS"
RECOMP_PROBE_TRACE = "FZGX_TRACE"

[[probe.value]]
name = "module"
at = 0x800030C8
width = 4
note = "main.rel's base as the game recorded it."
source = "probe; PP §1.3"

[[probe.value]]
name = "mode"
at = "main.rel:bss+0x960"
width = 2
source = "probe"

[[probe.value]]
name = "submode"
at = "main.rel:bss+0x962"
width = 2
source = "probe"

[[probe.value]]
name = "race_frame"
at = "main.rel:bss+0x50A4"
width = 4
source = "SD; probe"

[[probe.value]]
name = "busy"
at = "main.rel:data+0x2B64"
width = 4
note = "Non-zero while the main thread is mid-frame (cmpsim.py compares sim_hash only where it is 0)."
source = "probe; scripts cmpsim.py (the first experiment's)"

[[probe.hash]]
name = "seat0_hash"
ranges = [{ pointer = "main.rel:bss+0x6D838", size = 0x620 }]
note = "The player's racer block."
source = "SM §4 (the racer array: 30 x 0x620 through the pointer at .bss 0x6D838); probe"

[[probe.hash]]
name = "racers_hash"
ranges = [{ pointer = "main.rel:bss+0x6D838", offset = 0x620, size = 0xB1A0 }]
note = "The other 29 racer blocks."
