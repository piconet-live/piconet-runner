# F-Zero GX (GFZE01): the manifest for recomp-kit.
#
# Format: recomp-kit docs/manifest.md. Check with
#   python3 <recomp-kit>/tools/manifest/validate.py recomp/manifest.toml --strict --questions
#
# Every value here comes from our notes or from the scripts and patches committed in this repository, and each
# entry says which. Nothing here is game data: addresses, names, sizes, hashes and settings only.
#
# Sources, as abbreviated in `source`:
#   SM       the spike-moderngekko notes
#   SC       the spike-dolrecomp-codegen notes as on main (2232b71)
#   SC+      the same note as on branch spike/dolrecomp-codegen (ffc0f0f), which is ahead of main: "The dual-core
#            gate", "16", "17a", "18. Closed physics", "The race start in dual core", "19", "20", "Audio",
#            "State at hand-over", "What a launcher needs to start this"
#   PP       the plan-moderngekko-port notes
#   SD       the spike-determinism notes
#   SR       the spike-race-setup notes
#   RO       the spike-rollback-online notes
#   FI       the plan-frame-interpolation notes
#   probe    forks/recompcore/1-base/0001-spike-the-codegen-spike-s-runtime-changes-at-its-han.patch, FzgxProbe.cpp
#   scripts  the scripts of the two recompilation experiments; the file is named. The codegen experiment's are the
#            speed work's (the cg-*.sh family and its helpers), still beside the experiments until that work lands;
#            the first experiment's are archived (finished: nothing runs them)
#   sha1     decomp/fzgx/config/GFZE01/build.sha1 (SM §2 and §3 say our files match it)
# A value whose only source is "probe" or "scripts" is in no note: it is what the tools that produced the gate
# results used. Values the notes do not settle are left out.

schema = 1

[game]
id = "GFZE01"
title = "F-Zero GX"
region = "NTSC-U"
platform = "gamecube"
mem1_size = 0x1800000   # the retail 24 MiB: every gate ran with it, and it is the intended product configuration
symbols = "rayanht/fzgx at 3a0542c9 (decompilation; fn_1_X is main.rel .text + X)"
source = "FI header (NTSC-U, GFZE01); SD (24 MB of main RAM); SC+ 'The dual-core gate' (Memory size); PP header (the decompilation's commit)"

[reference]
emulator = "ModernGekko a2e4e2b, whose emulator core is Dolphin 2606"
core = "Jit64"
note = "Results compare native code with Dolphin 2606's Jit64, not with our 2512 fork: 2606 changed single-precision FMA rounding (upstream 58487f1633). The reference runs the game with FPRF on, from its game settings."
source = "SM §1 (versions), §4 (caveat), §5 (FPRF = True)"

# ---- tools -----------------------------------------------------------------------------------------------------------

[[toolchain]]
name = "ModernGekko"
commit = "forks/upstream.tsv, row moderngekko"
patches = "forks/moderngekko/"
note = "Builds with MSVC (Visual Studio 2022 Build Tools, MSVC 14.44), CMake and Ninja; about 25 minutes cold."
source = "SM §1"

[[toolchain]]
name = "RecompCore (ModernGekko's vendor/dolphin)"
commit = "forks/upstream.tsv, row recompcore"
patches = "forks/recompcore/"
note = "The patch holds the probe, the fast paths, the idle-PC list, RecompCore PR #19 with its fix, and the gather-pipe hand-over. PP's header names 8b47e90bf6 for the same folder: which of the two commits the patch is against is not settled."
source = "SM §1; SC Method; the codegen experiment's README (archived)"

[[toolchain]]
name = "DolRecomp"
commit = "forks/upstream.tsv, rows dolrecomp and dolrecomp-vendored"
branch = "fzgx/codegen"
patches = "forks/dolrecomp/ (one patch per commit); forks/dolrecomp-vendored/ (the checkout inside RecompCore, which the runner's build reads)"
note = "The DolRecomp that RecompCore cf8ceb8 pins. Head (c876e2b) cannot be loaded by this runtime."
source = "SM §1; SC Method"

[[toolchain]]
name = "LLVM"
commit = "clang+llvm-20.1.8-x86_64-pc-windows-msvc"
note = "The official portable package, the same as DolRecomp's CI. Its LLVMExports.cmake must be pointed at the VS 2022 Build Tools DIA SDK."
source = "SM §1"

# ---- code modules ----------------------------------------------------------------------------------------------------

[[module]]
name = "main.dol"
kind = "dol"
obtain = "executable"
disc_path = "sys/main.dol"
sha1 = "421c88106697d3275a3fc26fb7a01bf6d816b271"
compile = true
note = "Recompiles in 1 s (C backend) or 2 min (LLVM). The copy the builds read carries the pin 'sample-alloc-pad'."
source = "SM §2 (hash prefix, matches the decompilation); sha1 (full hash); PP §1.5 (sys/main.dol)"

[[module]]
name = "main.rel"
kind = "rel"
obtain = "memory-dump"
disc_path = "files/enemy_line/line__.bin"   # encrypted and compressed; PP §2.1 writes bg/enemy_line, the disc tree has enemy_line
sha1 = "df989873851d161218ae283f71ed89ce0a979955"   # of the unpacked file, 2,221,812 bytes
compile = true
load = "runtime"
load_address = 0x801BA660
base_pointer = 0x800030C8
varies_with = "The game pads two allocations with 32 x ((OSGetTick() & 31) + 1): the address moves with the engine's cycle accounting, the boot code list, the clock and probably the overclock. Seen: 0x801BA640 + 32k for k from 1 to 32."
pins = ["sample-alloc-pad", "mainrel-pad"]
dump = { file = "mainrel-ram-801ba660.bin", covers = "text", when = "main.rel's relocated text, dumped from memory after the game's loader linked it, with the boot codes applied (so the Gecko insert at fn_1_ECC is in the image)" }
unpack = { tool = "the decompilation's linecrypt and avlz (pure Python)", use = "checks the unpacked file's hash; the build uses the memory dump, whose relocations are exactly as the game applied them" }
sections = { text = { offset = 0xDC, size = 0x15F62C }, data = { offset = 0x16D600, size = 0x4C9C1 }, bss = { offset = 0x1BA040, size = 0x8FEA4 } }
note = "Appended to main.dol as a third text section (port/image/gameinput.py) so DolRecomp compiles both together. 127 bytes of padding lie between .data's end and .bss."
source = "SM §3 (derivation, hash prefix, pinned address, how it is compiled); sha1; PP §1.3 ([0x800030C8]) and §2.1 (the address rule); PP §3.2 (.text = header + 0xDC); FI header (.bss at 0x803746A0); SC 'Calls from native code' (codes in the image); scripts cg-build.sh (text size 0x15F62C); probe (.data offset and size, .bss size)"

[[module]]
name = "fze.sample.rel"
kind = "rel"
obtain = "disc-file"
disc_path = "files/fze.sample.rel"
sha1 = "7679d58798cbd0e47563a6a307410623979efc97"
compile = false
sections = { text = { offset = 0xBC, size = 0x3FC } }   # here the offset is the file offset of .text
note = "The loader stub: main.dol links it, its _prolog decrypts, unpacks and links main.rel, then it is unlinked and cleared. Runs once at boot, on the fallback core. The pin 'mainrel-pad' changes one word of it."
source = "PP §2.1; sha1 (sample/sample.rel)"

[[module]]
name = "fze.menu-rels"
kind = "rel"
obtain = "disc-file"
disc_path = "files/fze.*.rel"
compile = false
note = "The menu modules (car_colchg, customize, interview, movie, movie_module, option, pilotpoint, profile, replay, sel, story, title, winning). They load per mode from a heap and do not run in a race; they have no tick pad. Not compiled: they run on the fallback core. Their hashes are in the decompilation's build.sha1."
source = "SM §3 (not compiled, in files/); PP §2.4 (how they load)"

# ---- pins ------------------------------------------------------------------------------------------------------------

[[pin]]
name = "sample-alloc-pad"
purpose = "fze.sample.rel and the decryption buffer land at fixed places, so memory after boot is identical"
module = "main.dol"
relies_on_sha1 = "421c88106697d3275a3fc26fb7a01bf6d816b271"
applied = "extracted-copy"
result = "The top-of-arena allocations no longer depend on the tick. It does not move main.rel; it makes whole-memory comparisons across engines meaningful."
writes = [
  { address = 0x80005940, file_offset = 0x2940, was = "bl OSGetTick", becomes = "li r3,0" },
]
note = "In fn_8000591C. The original is kept beside the patched file as *.orig."
source = "SM §3 (pinning); PP §2.2 (file offset, effect)"

[[pin]]
name = "mainrel-pad"
purpose = "main.rel loads at one address under every core and module"
module = "fze.sample.rel"
relies_on_sha1 = "7679d58798cbd0e47563a6a307410623979efc97"
applied = "extracted-copy"
result = "The pad is 32 bytes, so main.rel's first byte is at 0x801BA660 (text 0x801BA73C)."
writes = [
  { file_offset = 0x104, was = "and r5,r0,r3", becomes = "li r5,0" },   # .text + 0x48
]
note = "The tick call at .text + 0x3C is left alone because OSLink relocates it. For the product PP §2.3 plans a nine-word patch of main.dol alone, written to memory after the DOL loads, which makes the DOL write this word itself; it is not applied in any run so far."
source = "SM §3 (pinning); PP §2.2 (file offset 0x104 = 0xBC + 0x48)"

# ---- configurations --------------------------------------------------------------------------------------------------

[[configuration]]
name = "single-core"
what = "The GPU's work runs on the emulated CPU's thread. This is what Dolphin's own settings for the game give."
settings = { "Core.CPUThread" = false }
note = "Every run up to build 15 was single core. Here the JIT reproduces its own memory to the word."
source = "SC 'Dual core is what ships'; SC Method"

[[configuration]]
name = "dual-core"
what = "The GPU has its own thread."
ships = true
primary = true
env = { FZGX_DUALCORE = "1" }
note = "What the shipping fork runs, and the configuration each step is judged in from build 15c on. No build reproduces its own memory here; see the noise set 'dual-core-timing'."
source = "SC 'Dual core is what ships'; SC+ Status and 'The dual-core gate'; forks/moderngekko/1-base/0001-spike-the-codegen-spike-s-runner-changes-at-its-hand.patch (the variable)"

# ---- emulator and runner settings ------------------------------------------------------------------------------------

[[setting]]
key = "Core.EnableCustomRTC"
value = true
where = "emulator-config"
reason = "Turns on the fixed clock below."
source = "SD Method"

[[setting]]
key = "Core.CustomRTCValue"
value = "0x386d4380"
where = "emulator-config"
reason = "The clock seeds the OS time base. With another clock the race differs everywhere by frame 3600, the boot takes another number of frames and main.rel loads elsewhere."
source = "SD Method and 'What the clock changes'; SM §1 (Runs)"

[[setting]]
key = "Core.Overclock"
value = 6.0
where = "emulator-config"
reason = "With 30 machines a step plus re-simulated steps overruns the frame's budget of emulated time at 1x and the game drops to 30 fps; our matches default to 6. One game at 3x and one at 1x agreed on every checksum, so the clock does not touch the simulation."
source = "SM §4 (Method: overclock 6); RO 'Emulated CPU clock' and 'Half the frame rate in the race'; PP §1.3"

[[setting]]
key = "Core.EmulationSpeed"
value = 0.0
where = "emulator-config"
reason = "Unthrottled: the per-call figures are wall time and must not include the limiter. Emulation speed does not change the race."
source = "SC header (unthrottled); SM §5; SR (speed and sound do not change the race)"

[[setting]]
key = "Interface.UsePanicHandlers"
value = false
where = "emulator-config"
reason = "A panic dialog would hold an unattended run."
source = "SM §1 (Runs: panic dialogs off)"

[[setting]]
key = "Core.EnableCheats"
value = true
where = "emulator-config"
reason = "The boot-to-race and set-up codes are Gecko codes; the saved states were recorded with them and main.rel's image holds their hook."
source = "SM §2; SC 'Calls from native code'"

[[setting]]
key = "Core.CPUThread"
value = false
where = "game-config"
reason = "Not ours: Dolphin's settings for the game (GFZ.ini, and the user GFZE01.ini) set it, and that layer wins over the main configuration. Dual core therefore needs the current-run override FZGX_DUALCORE=1."
source = "SC 'Dual core is what ships'"

[[setting]]
key = "Core.StaticRecompIdlePC"
value = "0x8001071C"
where = "emulator-config"
applies = "native"
reason = "Native code spins in the OS idle loop (SelectThread) unless it is told; Dolphin's JIT skips that loop by itself."
source = "SM §2"

[[setting]]
key = "FZGX_L1_AS_MEM2"
value = "1"
where = "runner-env"
applies = "native"
reason = "The runtime points the second direct-memory window at the locked L1 cache (the game's scratchpad at 0xE0000000). It goes with the build switch DOLRECOMP_MEM2_BASE."
source = "SM §5 (the locked L1 cache); scripts cg-run.sh (the variable)"

[[setting]]
key = "FZGX_IDLE_PCS"
value = "8006FE18,80006388,802C1008"
where = "runner-env"
applies = "native"
reason = "Three waits the game spins in, counted as idle time. 8006FE18: the GPU-sync wait loop in fn_8006FDEC polls OSGetTime; with overclock 6 the game spins there (40% of all dispatches); this is the return point after OSGetTime in the loop. 80006388 and 802C1008: the two waits for the disc (see the facts 'disc-read' and 'load-queue'); unidled, every load ran at 60 to 140 ms a field on native code."
note = "In dual core, skipping this loop lets native reach the next VI while the GPU thread is still busy: the race start can slip by one field. See the difference 'dual-core-start-slip'."
source = "SC §1 (the wait loop, StaticRecompIdlePCs); scripts cg-run.sh (the variable); SC+ 'The race start in dual core'"

[[setting]]
key = "--no-mods"
value = true
where = "runner-arg"
reason = "The pinned module template only answers the mod-patch query as 'always available', and with no mod loaded no host call is installed, so no interception cost is measured. Nothing is proven with mods loaded."
source = "SM §1 (the shim) and §5 (mod interception); SC 'Rule for hooks and mods'"

# ---- scenes ----------------------------------------------------------------------------------------------------------

[[scene]]
name = "race300"
exercises = "A 30-machine Practice race on Twist Road, from race frame about 300: the player holds the accelerator into walls, last and alone; 29 CPUs race. Steady-state physics load. No pack, no contact between machines in view, no start, no finish."
