[[exactness.noise]]
name = "audio"
what = "The regions that differ once a sound update has reached the mixer one audio frame apart: the AX voice parameter blocks, the audio output buffers, a heap block that changes with them (by its behaviour the effect delay lines), and a few words beside them."
